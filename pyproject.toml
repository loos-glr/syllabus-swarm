[project]
name = "syllabus-swarm"
version = "0.1.0"
description = "Multi-agent curriculum generator for Dutch MBO4 vocational education"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top (sys.path manipulation)
    "B904",  # raise from within except (Python 3.11+ chaining is automatic)
    "SIM108", # ternary operator suggestion (readability preference)
    "SIM102", # nested if collapse (readability preference)
    "SIM105", # contextlib.suppress (explicit try/except is clearer)
    "SIM117", # nested with combine (readability preference)
    "B017",  # assert blind exception (pytest.raises context)
    "B007",  # unused loop variable (intentional in some cases)
    "N802",  # function name should be lowercase (pytest method names)
    "C408",  # unnecessary dict() call (explicit is clearer)
    "UP036", # version block is intentional — catches `python3 src/main.py` under <3.12
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true