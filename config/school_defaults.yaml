# =============================================================================
# school_defaults.yaml — Institution-Wide Defaults for Dutch MBO4 Programmes
# =============================================================================
#
# This file defines the immutable, institution-wide defaults that apply to
# EVERY course generated by Syllabus Swarm.  These values reflect the real
# constraints of Dutch MBO niveau 4 Software Developer (crebonummer 25604)
# programmes and should rarely change.
#
# When a user loads a named cohort profile (via --profile), the profile
# values take priority over these defaults.  Any value the profile omits
# falls back to what is defined here.
#
# =============================================================================

# --- Organisation Identity ---------------------------------------------------
organisation:
  name: "MBO College — ICT Academy"
  crebonummer: "25604"
  qualification: "Software Developer (MBO niveau 4)"
  country: "NL"
  language_of_instruction: "nl"

# --- Material Language --------------------------------------------------------
# The default human language for ALL instructional materials (syllabi, theory
# artifacts, lab READMEs, code comments, assessments, reviews).
# Options: "Dutch" (Nederlands) or "English".
material_language: "Dutch"

# --- Grading Scale -----------------------------------------------------------
# Dutch MBO uses O/V/G (Onvoldoende / Voldoende / Goed).
# O = Insufficient  (< 5.5 on a 1-10 scale)
# V = Sufficient    (5.5 – 7.5 on a 1-10 scale)
# G = Good          (> 7.5 on a 1-10 scale)
grading_scale:
  type: "OVG"
  levels:
    - key: "O"
      label: "Onvoldoende"
      description: "Onvoldoende — voldoet niet aan de minimumeisen"
      min_score: 0.0
      max_score: 5.4
    - key: "V"
      label: "Voldoende"
      description: "Voldoende — voldoet aan de minimumeisen"
      min_score: 5.5
      max_score: 7.5
    - key: "G"
      label: "Goed"
      description: "Goed — overtreft de minimumeisen"
      min_score: 7.6
      max_score: 10.0

# --- Hardware Constraints ----------------------------------------------------
# Many MBO classrooms run on thin clients, Chromebooks, or student BYOD
# laptops.  These constraints inform which tooling and platforms are viable.
hardware_constraints:
  student_device: "BYOD laptop (Windows/macOS/Linux) or school-provided Chromebook"
  min_ram_gb: 8
  min_disk_gb: 20
  internet_required: true
  offline_fallback_available: true
  notes: >
    Students are expected to bring their own laptop (BYOD).
    School provides Chromebooks as a fallback for students without a device.
    Docker Desktop may be unavailable on school-managed Windows devices;
    prefer cloud-based dev environments (GitHub Codespaces / GitPod) when
    containerisation is required.

# --- Default Technology Stack -------------------------------------------------
# The baseline tooling assumed for every course unless overridden by a cohort
# profile or the Intake Specialist interview.
default_tech_stack:
  version_control: "Git (GitHub Classroom)"
  editor: "VS Code"
  ci_cd: "GitHub Actions (optional)"
  deployment: "Render / Railway / Netlify (free tiers for student projects)"
  database: "SQLite (local) / PostgreSQL (production)"

# --- SBB Kerntaken -----------------------------------------------------------
# The four kerntaken (core tasks) from the SBB Kwalificatiedossier for
# Software Developer (25604).  Every syllabus must map learning outcomes
# back to these.
kerntaken:
  - id: "P1-K1"
    name: "Plannen van software"
    description: "Planning software development work: requirements analysis, sprint planning, time estimation."
  - id: "P2-K1"
    name: "Ontwerpen van software"
    description: "Designing software: architecture, UML diagrams, data modelling, API design."
  - id: "P3-K1"
    name: "Realiseren van software"
    description: "Building software: coding, debugging, refactoring, version control."
  - id: "P4-K1"
    name: "Testen van software"
    description: "Testing software: unit tests, integration tests, acceptance tests, test plans."

# --- Student Pathway Options --------------------------------------------------
student_pathways:
  BOL:
    name: "Beroepsopleidende Leerweg"
    description: "School-based pathway: ~60% school instruction, ~40% BPV internship"
    min_bpv_hours: 900
    typical_year_bpv_starts: 2
  BBL:
    name: "Beroepsbegeleidende Leerweg"
    description: "Work-based pathway: ~20% school instruction, ~80% BPV work"
    min_bpv_hours: 1350
    typical_year_bpv_starts: 1

# --- Year Level Defaults -----------------------------------------------------
year_levels:
  1:
    title: "Foundation Year"
    focus: "Programming fundamentals, basic tooling, introductory projects"
  2:
    title: "Specialisation Year"
    focus: "Framework proficiency, database design, testing, BPV preparation"
  3:
    title: "Proeve Year"
    focus: "Proeve van Bekwaamheid (final exam project), portfolio, BPV"

# --- BPV (Internship) Readiness ----------------------------------------------
bpv_readiness_levels:
  - "pre-bpv"
  - "bpv-ready"
  - "post-bpv"

# --- Pedagogical Defaults ----------------------------------------------------
pedagogical_defaults:
  contact_hours_per_week: 16
  self_study_hours_per_week: 12
  project_weeks_per_semester: 2
  humanics_framework: true
  backward_design: true
  dutch_didactic_approach: "Activerende didactiek met scaffolding en formatief evalueren"