# =============================================================================
# Cohort Profile: MINOR2 Immersive Design
# =============================================================================

# ---------------------------------------------------------------------------
# TOP-LEVEL METADATA — REQUIRED
# ---------------------------------------------------------------------------

profile:
  name: "MINOR2 Immersive Design (WebXR & Unity) — BOL Pathway (Year 2)"
  description: >
    Creative Software Developer (MBO 4) studenten in hun tweede jaar. Ze hebben een 
    sterke basis in HTML, CSS, JavaScript (DOM, OOP, arrays, events) en PHP (CRUD).
    Deze 32-weken durende minor (Keuzedeel K0781: Virtual en augmented reality) 
    introduceert ze in ruimtelijk denken, 3D-interfaces en de C# syntax via Unity. 
    Om de cognitieve belasting te managen start het programma met WebXR (HTML/JS) 
    en een multidisciplinair cross-over project met Physical Digital studenten (die 
    fysieke controllers bouwen voor WebXR). In de tweede helft wordt de overstap naar 
    Unity gemaakt voor de realisatie van een klantcasus. Het onderwijs is 100% 
    studio-gestuurd (geen zelfstudie).

