profile:
  name: "VMBO Orientatie - Mega Villains Inc. - Beginner"
  description: >
    Een 20-weekse oriëntatieworkshop voor VMBO studenten (BB, KB, GL, Havo) op beginnersniveau. Het doel is kennismaken met applicatieontwikkeling via Figma, HTML en Javascript, inclusief plan van aanpak, peer-testen en evaluatie.

year_level: 1
student_pathway: "BOL"
bpv_readiness: "pre-bpv"

tech_stack:
  primary_language: "Pseudocode voor differentiatie HTML, CSS & Javascript"
  framework: "N/A"
  frontend: "Figma en voor differentiatie HTML, CSS, Javascript"
  database: "N/A"
  version_control: "Lokaal met mappenstructuur op USB-stick"
  editor: "Figma, alleen voor differentiatie vs code om html en css te schrijven"
  testing:
    framework: "Handmatig via peer-testing en testformulier"
    coverage_target: "N/A"
  ci_cd: "N/A"
  containerisation: "N/A"
  deployment: "N/A"

kerntaken_emphasis:
  P1-K1: "moderate"   # Plan van aanpak, eisen klant, flowchart
  P2-K1: "heavy"      # Figma ontwerpen, moodboard, wireframes, persona
  P3-K1: "moderate"   # Basis HTML en Javascript oefeningen
  P4-K1: "moderate"   # Testrapport schrijven door een klasgenoot (peer-testing)

grading_scale: "1-10" # SE1 en SE2 puntenberekening leidt tot een eindcijfer
hardware_constraints: "Computer met internetverbinding en een USB-stick."

assessment:
  practical_exams: 0
  portfolio_items: 6  # Plan van aanpak, app in Figma, HTML/JS oefeningen, testverslag, handleiding, evaluatieverslag
  proeve_preparation: false
  code_reviews_per_semester: 1