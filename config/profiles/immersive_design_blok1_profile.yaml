# =============================================================================
# Cohort Profile: MINOR2 Immersive Design - Blok 1: WebXR Introductie
# =============================================================================

# ---------------------------------------------------------------------------
# TOP-LEVEL METADATA — REQUIRED
# ---------------------------------------------------------------------------

profile:
  name: "MINOR2 Immersive Design (WebXR Intro) — BOL Pathway (Year 2)"
  description: >
    Introductiemodule (4 weken) voor de minor Virtual en augmented reality.
    Doelgroep: 2e-jaars Creative Software Developer (MBO 4) studenten met basiskennis
    HTML, CSS en JavaScript (DOM, OOP, arrays, events). 
    Doel: Studenten laten wennen aan ruimtelijk denken, 3D-interfaces en XYZ-coördinaten
    voordat zij overstappen naar Unity. Er wordt gewerkt met WebXR via A-Frame om de 
    leercurve laag te houden.
    
    Project Context (Thema: 'Immersed'): Na een recente strandexcursie om de zintuigen 
    te prikkelen, bouwen de studenten een 'Zintuigelijke Strandervaring' in de browser. 
    Ze leren 3D-objecten positioneren, basis animaties toepassen en JavaScript event-listeners 
    (zoals click/gaze) toevoegen aan 3D-elementen om interactie (geluid, beweging, tekst) te triggeren.
    
    Randvoorwaarden: 100% studio-gestuurd onderwijs (exact 4 contacturen per week, 0 uur zelfstudie). 
    Het testen van WebXR op een mobiele telefoon (via lokaal netwerk of GitHub Pages) wordt 
    enkel aangeboden als bonus/uitdaging voor snelle studenten, zodat dit niet ten koste gaat 
    van de kernkennis.

