  P2-K1: "moderate"   # Designing — Ruimtelijke ontwerpprincipes (scale, position, rotation) vertaald naar het strandthema
  P3-K1: "heavy"      # Building — Programmeren van 3D-logica, animaties en interactie-events met JavaScript
  P4-K1: "light"      # Testing — Werkt de interactie in de desktop browser (en optioneel op mobiel)?

